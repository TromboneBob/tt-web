<!DOCTYPE html>
<html lang="no">
<body>
<!-- This file exists so Netlify can detect the form during build. Submissions are made from the Vue app. -->
<form name="bryllup-skjema" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="bryllup-skjema" />
  <input type="text"   name="brud-navn" />
  <input type="tel"    name="brud-telefon" />
  <input type="email"  name="brud-epost" />
  <input type="text"   name="brud-adresse" />
  <input type="text"   name="brudgom-navn" />
  <input type="tel"    name="brudgom-telefon" />
  <input type="email"  name="brudgom-epost" />
  <input type="text"   name="brudgom-adresse" />
  <input type="text"   name="toastmaster-navn" />
  <input type="tel"    name="toastmaster-telefon" />
  <input type="email"  name="toastmaster-epost" />
  <input type="text"   name="forberedelse-brud" />
  <input type="text"   name="forberedelse-brudgom" />
  <input type="text"   name="vielse" />
  <input type="text"   name="mottakelse" />
  <input type="number" name="antall-gjester" />
  <textarea            name="timeline"></textarea>
  <input type="file"   name="timeline-fil" />
  <textarea            name="portrett-lokasjon"></textarea>
  <input type="text"   name="portrett-backup" />
  <textarea            name="shot-list"></textarea>
  <textarea            name="spesielle-onsker"></textarea>
  <textarea            name="restriksjoner"></textarea>
  <input type="text"   name="blits" />
  <input type="text"   name="godkjenning-utstyr" />
  <input type="text"   name="godkjenning-mat" />
  <input type="text"   name="godkjenning-overtid" />
  <input type="text"   name="godkjenning-promotering" />
  <input type="submit" value="Send inn" />
</form>
</body>
</html>
